<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота 5 - Завдання 3</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <form>
        <h1>Анкета</h1>

        <fieldset>
            <legend>Особисті дані</legend>
            <label>Прізвище та ім'я <input type="text"></label>
            <label>Email <input type="email"></label>
            <label>Дата народження <input type="date"></label>
        </fieldset>

        <fieldset>
            <legend>Додатково</legend>
            <label>Стать
                <select>
                    <option>Чоловіча</option>
                    <option>Жіноча</option>
                </select>
            </label>
            <label><input type="checkbox"> Погоджуюсь на розсилку</label>
            <label>Про себе <textarea rows="4"></textarea></label>
        </fieldset>

        <button type="submit">Надіслати</button>
    </form>
</body>
</html>

<body style="font-family: Arial, sans-serif; padding: 20px;">

    <h1 align="center">Завдання 1. Квадратна таблиця з рамками</h1>

    <table border="1" cellpadding="15" cellspacing="0" align="center" style="border: 2px solid black; border-collapse: collapse; text-align: center;">
        <tr>
            <td style="border: 2px solid black; width: 80px; height: 80px;">1</td>

        <tr>
            <td style="border: 2px solid black; width: 80px; height: 80px;">6</td>

    <hr style="margin: 40px 0;">

    <h1 align="center">Завдання 2. Картина Піта Мондріана</h1>

    <table border="1" cellspacing="0" align="center" style="border: 4px solid #000000; border-collapse: collapse; width: 400px; height: 400px; table-layout: fixed;">
        <tr style="height: 120px;">
            <td rowspan="2" style="background-color: #ff5b2d; border: 4px solid #000000; width: 150px;"></td>
            <td colspan="2" style="background-color: #ffffff; border: 4px solid #000000;"></td>
            <td style="background-color: #ffffff; border: 4px solid #000000; width: 60px;"></td>

        <tr style="height: 140px;">

            <td style="background-color: #ffffff; border: 4px solid #000000;"></td>
        </tr>
        <tr style="height: 140px;">
            <td style="background-color: #fffe69; border: 4px solid #000000;"></td>
            <td style="background-color: #ffffff; border: 4px solid #000000;"></td>

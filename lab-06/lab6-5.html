<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Погода</title>
  <style>
    body { margin: 0; padding: 30px; background: #fff; font-family: Arial, sans-serif; }

    .scene {
      position: relative;
      width: 540px;
      height: 400px;
      background: #c4c4c4;
      overflow: hidden;
    }

    /* чорний квадрат */
    .photo {
      position: absolute;
      top: 25px; left: 105px;
      width: 260px; height: 280px;
      background: #000;
      z-index: 1;
    }

    /* хмара */
    .cloud {
      position: absolute;
      top: 110px; left: 200px;
      width: 200px; height: 90px;
      background: #fff;
      border-radius: 60px;
      filter: blur(8px);
      box-shadow:
        -60px 40px 0 -10px #eee,
         60px -30px 0 10px #fff,
        120px 20px 0 0 #ddd,
         30px 60px 0 -5px #f5f5f5;
      opacity: 0.95;
      z-index: 2;
    }

    /* температура */
    .temp {
      position: absolute;
      left: 30px; bottom: 90px;
      font-size: 110px;
      font-weight: bold;
      color: rgba(255, 255, 255, 0.55);
      z-index: 3;
    }

    /* кнопки-стрілки напівпрозорі */
    .arrows { position: absolute; top: 100px; left: 20px; z-index: 4; }
    .arrows span {
      display: inline-block;
      width: 60px; height: 60px;
      line-height: 56px;
      text-align: center;
      font-size: 46px;
      color: #333;
      background: rgba(0, 0, 0, 0.2);
    }
    .arrows span + span { background: rgba(0, 0, 0, 0.3); }

    /* прогноз з тінню */
    .forecast {
      position: absolute;
      right: 20px; bottom: 20px;
      width: 300px; height: 130px;
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      padding-bottom: 12px;
      background: rgba(255, 255, 255, 0.55);
      box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.25);
      z-index: 3;
    }
    .forecast div { text-align: center; font-size: 22px; color: #333; }
    .forecast small { display: block; font-size: 13px; color: #888; opacity: 0.7; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="scene">
    <div class="photo"></div>
    <div class="cloud"></div>
    <div class="arrows"><span>&larr;</span><span>&rarr;</span></div>
    <div class="temp">17</div>
    <div class="forecast">
      <div><small>Mon</small>17°</div>
      <div><small>Tue</small>19°</div>
      <div><small>Wed</small>16°</div>
      <div><small>Thu</small>18°</div>
      <div><small>Fri</small>21°</div>
    </div>
  </div>
</body>
</html>

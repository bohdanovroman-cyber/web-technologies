<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Лабораторна 6 – Завдання 1 (варіант 1)</title>
  <style>
    body { margin: 0; background: #fff; font-family: Arial, sans-serif; }

    .wrapper { position: relative; width: 1140px; height: 500px; margin: 20px; }

    .block {
      position: absolute;
      box-sizing: border-box;
      border: 2px solid #222;
      font-size: 32px;
      text-align: center;
      overflow: hidden;
    }

    .header  { top: 0;     left: 0;     width: 1100px; height: 120px; background: #00b050; z-index: 1; }
    .left    { top: 150px; left: 0;     width: 290px;  height: 320px; background: #5b8fd6; color: #fff; z-index: 2; }
    .center  { top: 150px; left: 325px; width: 445px;  height: 320px; background: #92d050; z-index: 2; }
    .right   { top: 150px; left: 810px; width: 290px;  height: 320px; background: #5b8fd6; color: #fff; z-index: 2; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="block header">Текст всередині блоку</div>
    <div class="block left">Текст всередині блоку</div>
    <div class="block center">Текст всередині блоку</div>
    <div class="block right">Текст всередині блоку</div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Лабораторна 6 – Завдання 2 (варіант 1)</title>
  <style>
    body { margin: 0; background: #fff; font-family: Arial, sans-serif; }

    .wrapper { position: relative; width: 460px; height: 165px; margin: 20px; }

    .block {
      position: absolute;
      box-sizing: border-box;
      border: 2px solid #222;
      text-align: center;
      font-size: 16px;
    }

    /* Блок 1 – завжди видимий */
    .block-1 { top: 0; left: 0; width: 130px; height: 40px; background: #00b050; line-height: 36px; }

    /* Блок 2 – з'являється при наведенні на Блок 1 */
    .block-2 {
      top: 0; left: 160px; width: 140px; height: 165px;
      background: #5b8fd6; color: #fff;
      opacity: 0;
      transition: opacity .3s;
    }

    /* Блок 3 – з'являється при наведенні на Блок 2 */
    .block-3 {
      top: 0; left: 320px; width: 140px; height: 165px;
      background: #614a7b; color: #fff;
      opacity: 0;
      transition: opacity .3s;
    }

    .block-1:hover + .block-2,
    .block-2:hover { opacity: 1; }

    .block-2:hover + .block-3,
    .block-3:hover { opacity: 1; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="block block-1">Блок 1</div>
    <div class="block block-2">Текст всередині Блоку 2</div>
    <div class="block block-3">Текст всередині Блоку 3</div>
  </div>
</body>
</html>
